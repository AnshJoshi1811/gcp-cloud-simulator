# GCP Stimulator — run the whole emulator (backend + frontend) in Docker.
#
# Quickstart:
#   docker compose up --build
#   open http://localhost:3000
#
# The backend manages its own Docker-backed resources (Compute instances,
# VPC networks, Cloud SQL/Memorystore, the Cloud Storage fake-gcs-server
# backend, etc) by talking to the HOST's Docker daemon via the mounted
# socket below — it does not run Docker-in-Docker.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Defaults to SQLite if unset. Point this at a real Postgres
      # connection string (e.g. postgresql://user:pass@host:5432/db) to
      # use Postgres instead.
      - DATABASE_URL=${DATABASE_URL:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
