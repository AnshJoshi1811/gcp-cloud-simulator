[project]
name = "minicloud"
version = "0.1.0"
description = "A local AWS emulator: EC2 instances become Docker containers, usable with real Terraform."
requires-python = ">=3.9"
dependencies = [
    "moto[server]>=5.0.0",
    "docker>=6.0.0",
    "click>=8.0.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
]

[project.scripts]
minicloud = "minicloud.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minicloud*"]
